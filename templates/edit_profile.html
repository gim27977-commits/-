{% extends 'base.html' %}
{% block title %}프로필 편집 - InstaClone{% endblock %}
{% block content %}

<div class="upload-box">
  <div class="page-title"><i class="fas fa-user-edit"></i> 프로필 편집</div>

  <form method="POST" enctype="multipart/form-data">
    <div style="text-align:center; margin-bottom:24px;">
      <img id="profile-preview"
           src="{{ url_for('static', filename='uploads/' + current_user.profile_image) }}"
           onerror="this.src='https://ui-avatars.com/api/?name={{ current_user.username }}&background=e1306c&color=fff&size=96'"
           style="width:96px; height:96px; border-radius:50%; object-fit:cover; border:2px solid #dbdbdb; cursor:pointer;"
           onclick="document.getElementById('profile-file').click()"
           alt="프로필 사진">
      <br>
      <small style="color:#0095f6; cursor:pointer;" onclick="document.getElementById('profile-file').click()">
        사진 변경
      </small>
      <input type="file" id="profile-file" name="profile_image" accept="image/*" style="display:none">
    </div>

    <div class="form-group">
      <label class="upload-label">사용자 이름</label>
      <input class="form-control" type="text" value="{{ current_user.username }}" disabled
             style="background:#fafafa; color:#8e8e8e;">
    </div>

    <div class="form-group">
      <label class="upload-label">소개</label>
      <textarea class="upload-textarea" name="bio" placeholder="자기소개를 입력하세요..." maxlength="150">{{ current_user.bio }}</textarea>
      <small style="color:#8e8e8e; font-size:12px;">최대 150자</small>
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" type="submit" style="flex:1;">저장</button>
      <a href="{{ url_for('profile', username=current_user.username) }}"
         class="btn btn-outline" style="flex:1; text-align:center; padding:10px;">취소</a>
    </div>
  </form>
</div>

<script>
document.getElementById('profile-file').addEventListener('change', function() {
  if (this.files && this.files[0]) {
    const reader = new FileReader();
    reader.onload = e => document.getElementById('profile-preview').src = e.target.result;
    reader.readAsDataURL(this.files[0]);
  }
});
</script>

{% endblock %}
